# nöbet with Docker Compose: a scanner that runs `nobet scan` every day, and
# the read-only nobet-web dashboard.
#
# Only the scanner gets the SSH key. The dashboard reads the scan history
# from a read-only volume, holds no keys, cannot reach your servers through
# any code it contains, and is published on this machine's localhost only.
# Put an authenticating reverse proxy in front of it, or use its built-in
# OpenID Connect sign-in (see the README), before anyone else uses it.
#
# Setup (details in the README, section "Docker"):
#   mkdir -p config secrets
#   cp hosts.example config/hosts                    # your hosts, one per line
#   ssh-keygen -F web01 >> config/known_hosts        # trusted host keys, per host
#   ssh-keygen -t ed25519 -N '' -C nobet-scan -f secrets/id_ed25519
#   sudo chown 65532 secrets/id_ed25519              # the containers' user
#   docker compose up -d
#   open http://127.0.0.1:8080
#
# Images: the signed release images from ghcr.io, pinned with NOBET_VERSION
# (for example NOBET_VERSION=0.2.0 in a .env file next to this one; the
# default is latest). `docker compose up -d --build` builds them from this
# checkout instead, and Compose also builds when the image cannot be pulled.
name: nobet

services:
  scanner:
    build:
      context: .
      target: scanner
    image: ghcr.io/olgacveysel/nobet-scanner:${NOBET_VERSION:-latest}
    restart: unless-stopped
    environment:
      NOBET_INTERVAL: 24h
    volumes:
      - nobet-data:/var/lib/nobet
      - nobet-queue:/var/lib/nobet-queue
      # hosts, known_hosts, and optionally allowlist, ssh_config and an
      # executable on-change hook (contrib/hooks/slack works here)
      - ./config:/etc/nobet:ro
    secrets:
      - ssh_key
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  web:
    build:
      context: .
      target: web
    image: ghcr.io/olgacveysel/nobet-web:${NOBET_VERSION:-latest}
    restart: unless-stopped
    # Starting after the scanner lets it create the shared volume with the
    # right owner.
    depends_on: [scanner]
    # To log who viewed what behind your proxy, add the header it sets:
    # command: ["-listen", ":8080", "-user-header", "X-Forwarded-User"]
    # To let users ask for scans ("Scan now"), which the scanner container
    # runs within 30 seconds, add "-scan-queue", "/var/lib/nobet-queue".
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - nobet-data:/var/lib/nobet:ro
      # Only scan requests are written here; the scanner reads them.
      - nobet-queue:/var/lib/nobet-queue
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

secrets:
  ssh_key:
    file: ./secrets/id_ed25519

volumes:
  nobet-data:
  nobet-queue:
