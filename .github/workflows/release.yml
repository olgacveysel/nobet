name: release
on:
  push:
    tags: ["v*"]
  # Build the release for a tag that already exists, for example after a
  # failed run: gh workflow run release -f tag=v0.1.0
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: read

# One run per tag at a time.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  # The tag this run releases. It is passed to goreleaser explicitly: when
  # two tags point at one commit (v0.1.0-rc1 and v0.1.0), goreleaser would
  # otherwise pick one of them by itself.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Binaries, archives, SBOMs, deb/rpm/apk packages and signed checksums
  # (.goreleaser.yaml), published as a GitHub release.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # keyless cosign signature for checksums.txt
    steps:
      - name: Check the tag
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::not a release tag: $TAG"; exit 1 ;;
          esac
      # A second run for a published tag would build everything and then fail
      # uploading files that exist, so stop here and say how to rebuild.
      - name: Check the tag is not released yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if n=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' 2>/dev/null) && [ "$n" -gt 0 ]; then
            echo "::error::$TAG is already released ($n files). To rebuild it, delete the release first (the tag stays): gh release delete $TAG"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      # Release binaries get the newest Go and its security fixes; go.mod
      # only sets the minimum.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      # Release notes: this version's section of CHANGELOG.md (v0.1.0-rc1
      # uses the v0.1.0 section). Without one, goreleaser lists the commits.
      - name: Release notes
        id: notes
        run: |
          version=${TAG#v}
          base=${version%%-*}
          awk -v h="## v$base" 'index($0, h " ") == 1 || $0 == h { found = 1; next } /^## / && found { exit } found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            echo "args=--release-notes $RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          fi
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}

  # The two images compose.yaml runs, for amd64 and arm64, with an SBOM and
  # build provenance attached and a keyless cosign signature. Pre-release
  # tags only get their version tag; `latest` and `X.Y` move on releases.
  images:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signature
    strategy:
      matrix:
        include:
          - target: scanner
            description: nöbet scanner, runs nobet scan on a schedule (holds the SSH key)
          - target: web
            description: nobet-web, the read-only nöbet team dashboard (holds no SSH keys)
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/nobet-${{ matrix.target }}
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # From the tag itself, so a manual run tags the images the same way.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
          labels: |
            org.opencontainers.image.title=nobet-${{ matrix.target }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
          annotations: |
            org.opencontainers.image.title=nobet-${{ matrix.target }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          push: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
