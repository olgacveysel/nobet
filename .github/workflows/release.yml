name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Binaries, archives, SBOMs, deb/rpm/apk packages and signed checksums
  # (.goreleaser.yaml), published as a GitHub release.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # keyless cosign signature for checksums.txt
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Release binaries get the newest Go and its security fixes; go.mod
      # only sets the minimum.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: anchore/sbom-action/download-syft@v0
      # Release notes: this version's section of CHANGELOG.md (v0.1.0-rc1
      # uses the v0.1.0 section). Without one, goreleaser lists the commits.
      - name: Release notes
        id: notes
        run: |
          version=${GITHUB_REF_NAME#v}
          base=${version%%-*}
          awk -v h="## v$base" 'index($0, h " ") == 1 || $0 == h { found = 1; next } /^## / && found { exit } found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            echo "args=--release-notes $RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          fi
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The two images compose.yaml runs, for amd64 and arm64, with an SBOM and
  # build provenance attached and a keyless cosign signature. Pre-release
  # tags only get their version tag; `latest` and `X.Y` move on releases.
  images:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signature
    strategy:
      matrix:
        include:
          - target: scanner
            description: nöbet scanner, runs nobet scan on a schedule (holds the SSH key)
          - target: web
            description: nobet-web, the read-only nöbet team dashboard (holds no SSH keys)
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/nobet-${{ matrix.target }}
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=nobet-${{ matrix.target }}
            org.opencontainers.image.description=${{ matrix.description }}
          annotations: |
            org.opencontainers.image.title=nobet-${{ matrix.target }}
            org.opencontainers.image.description=${{ matrix.description }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          push: true
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
