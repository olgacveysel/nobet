name: ci
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The latest Go, which releases are built with, and the minimum
        # in go.mod, which `go install` users may have.
        go: [stable, go.mod]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          check-latest: true
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # Includes the dependency guards: the CLI links no HTTP code and the
      # dashboard links no SSH client (cmd/*/deps_test.go).
      - run: go test -race ./...
      - run: go build ./cmd/nobet ./cmd/nobet-web
      - if: matrix.go == 'stable'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - if: matrix.go == 'stable'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

  # Test packages from every push to master: .deb, .rpm and .apk files
  # under the run's artifacts, without tagging a release.
  packages:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.apk
          retention-days: 14

  # The images compose.yaml builds.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target scanner -t nobet-scanner:ci .
      - run: docker build --target web -t nobet-web:ci .
      - run: docker run --rm nobet-web:ci -version

  # nobet scans Linux hosts but often runs from admin laptops; the ssh-agent
  # named pipe and path handling only exist on Windows.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/nobet
