name: ci
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Weekly, so govulncheck sees new advisories for dependencies even when
  # nothing was pushed.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The latest Go, which releases are built with, and the minimum
        # in go.mod, which `go install` users may have.
        go: [stable, go.mod]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          check-latest: true
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # Includes the dependency guards: the CLI links no HTTP code and the
      # dashboard links no SSH client (cmd/*/deps_test.go).
      - run: go test -race ./...
      - run: go build ./cmd/nobet ./cmd/nobet-web
      - if: matrix.go == 'stable'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - if: matrix.go == 'stable'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

  # Test packages from every push to master: .deb, .rpm and .apk files
  # under the run's artifacts, without tagging a release.
  packages:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      # Same SBOMs as a release (syft); keyless signing only works in the
      # release workflow.
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.apk
          retention-days: 14

  # The images compose.yaml builds, for both architectures the release
  # publishes (cross-compiled, so no emulation is needed to build them).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: docker buildx build --platform linux/amd64,linux/arm64 --target scanner .
      - run: docker buildx build --platform linux/amd64,linux/arm64 --target web .
      - run: docker buildx build --target web --load -t nobet-web:ci .
      - run: docker run --rm nobet-web:ci -version

  # nobet scans Linux hosts but often runs from admin laptops; the ssh-agent
  # named pipe and path handling only exist on Windows.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/nobet
